server:
  port: ${PORT:4002}

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optica_products}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-super-secreta-para-firmar-tokens-jwt-12345}

logging:
  level:
    org.springframework.security: INFO
