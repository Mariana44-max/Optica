server:
  port: ${PORT:4001}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/optica_auth?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-super-secreta-para-firmar-tokens-jwt-12345}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}

logging:
  level:
    org.springframework.security: INFO
